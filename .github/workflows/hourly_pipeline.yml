name: Pipeline Extractor Sala Biblioteca

on:
  schedule:
    - cron: '0 * * * *'  # Se ejecuta cada hora
  workflow_dispatch:      # Permite ejecución manual desde GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright click

      - name: Instalar Navegador Chromium y Dependencias del Sistema
        run: |
          npx playwright install-deps chromium
          playwright install chromium

      - name: Ejecutar Script de Extracción
        run: python pipeline_nlp.py

      - name: Guardar y Publicar JSON Actualizado
        run: |
          git config --global user.name 'Biblioteca Bot'
          git config --global user.email 'bot@biblioteca.com'
          git add datos_magnolia.json
          git commit -m "Auto-update: Estado de salas/ejemplares [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]" || exit 0
          git push