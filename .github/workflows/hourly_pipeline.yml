name: Pipeline Extractor Catalogo Biblioteca

on:
  schedule:
    - cron: '*/5 * * * *'  # Se ejecuta automáticamente cada 5 minutos
  workflow_dispatch:      # Permite la ejecución manual desde la pestaña Actions

# Otorga permisos explícitos de escritura al token de GitHub Actions
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright click

      - name: Instalar Navegador Chromium y Dependencias del Sistema
        run: |
          npx playwright install-deps chromium
          playwright install chromium

      - name: Ejecutar Script de Extracción
        run: python pipeline_nlp.py

      - name: Guardar y Publicar JSON Actualizado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'Biblioteca Bot'
          git config --global user.email 'bot@biblioteca.com'
          git add datos_magnolia.json
          git commit -m "Auto-update: Estado de salas/ejemplares [$(date -u +'%Y-%m-%dT%H:%M:%SZ')]" || exit 0
          git push origin main